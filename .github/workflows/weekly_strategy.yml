# RECONSTRUCTED FILE — see NOT_IN_THIS_ZIP.md at the project root.
#
# Not included in this zip export, but story-removal-and-fixes.diff and
# engagement_schedule.patch both show hunks applied *to* a real
# weekly_strategy.yml already running in your repo. Rebuilt from those
# fragments — diff against the live file on GitHub before replacing it.
#
# This is what actually calls weekly_strategy.py. Without it,
# strategy.json/format_schedule.json/the audience profile never update on
# their own — analytics.py, audience_profile.py, and schedule_builder.py all
# have real logic, but nothing invokes the function that reads their output
# and writes it back into next week's schedule unless this runs.

name: Weekly Strategy

on:
  schedule:
    # Friday, ahead of the new campaign week — campaigns._week_start()
    # treats Saturday as day 0, so this lands before that boundary
    # (12:00 UTC = ~15:30 Friday Tehran time, comfortably before Friday
    # midnight local).
    - cron: "0 12 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-strategy
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python weekly_strategy.py

      - name: Commit updated strategy
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/strategy.json data/format_schedule.json
          if git diff --staged --quiet; then
            echo "No strategy or schedule changes to commit."
            exit 0
          fi
          git commit -m "Weekly strategy + schedule update"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts."
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -d text="🔴 آپدیت استراتژی/برنامه‌ی هفتگی بعد از ۵ بار تلاش روی گیت push نشد — data/strategy.json و data/format_schedule.json فعلاً روی origin/main قدیمی موندن." \
              > /dev/null || echo "::warning::Admin alert send also failed."
          else
            echo "::warning::TELEGRAM_ADMIN_CHAT_ID or TELEGRAM_BOT_TOKEN not set — no admin alert sent for the push failure."
          fi
          exit 1
