name: Weekly Strategy Update

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch: {}

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python weekly_strategy.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated strategy
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/strategy.json
          git diff --staged --quiet || git commit -m "Weekly strategy update"
          git push