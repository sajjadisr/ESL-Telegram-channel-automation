name: Weekly Strategy Update

on:
  schedule:
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python weekly_strategy.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          # Optional — free (no credit card) fallback text model, tried only
          # if every Gemini key above fails. Leave unset to run Gemini-only.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

      - name: Commit updated strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/strategy.json data/format_schedule.json
          if git diff --staged --quiet; then
            echo "No strategy or schedule changes to commit."
            exit 0
          fi
          git commit -m "Weekly strategy + schedule update"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed (origin/main moved) — retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts."
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -d text="🔴 آپدیت استراتژی/برنامه‌ی هفتگی بعد از ۵ بار تلاش روی گیت push نشد — data/strategy.json و data/format_schedule.json فعلاً روی origin/main قدیمی موندن." \
              > /dev/null || echo "::warning::Admin alert send also failed."
          else
            echo "::warning::TELEGRAM_ADMIN_CHAT_ID or TELEGRAM_BOT_TOKEN not set — no admin alert sent for the push failure."
          fi
          exit 1