name: Daily Post

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional — leave the secret unset and this is just an empty string,
          # which the code treats the same as "not configured".
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Also optional — set these to turn on Eitaa/Bale cross-posting.
          # Leave a secret unset and that platform is silently skipped.
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}

      - name: Commit updated data
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily post: update memory, story and database"
          git push