# RECONSTRUCTED FILE — see NOT_IN_THIS_ZIP.md at the project root.
#
# This zip export didn't include .github/workflows at all, but
# story-removal-and-fixes.diff proves a real daily_post.yml already exists
# in your actual repo (that diff shows hunks being applied *to* it). This
# file is rebuilt from those hunks + config.py's own comments (POSTS_PER_DAY,
# the secrets every module reads) — it is NOT a copy of your live file.
# Diff it against the real one on GitHub before replacing anything; if they
# disagree, yours is the source of truth, not this.
#
# Without a workflow file like this, nothing in main.py runs on its own —
# every "autonomous"/"self-sustaining" mechanism in this codebase (topic
# auto-refill, spaced-repetition review, reader/news rotation, poll
# harvesting) only fires when something actually invokes `python main.py`.
# This is that invocation.

name: Daily Post

on:
  schedule:
    # POSTS_PER_DAY = 3 in config.py — one PRIMARY cron trigger per daily
    # slot, each followed ~45 min later by a CATCH-UP trigger that runs the
    # exact same job. Keep the primary count in sync with POSTS_PER_DAY
    # (main.py's own comment on that constant says the same thing).
    #
    # Why the catch-ups exist: GitHub's own docs say scheduled runs can be
    # delayed, and under high enough load, dropped outright, especially
    # around round minute marks (:00/:30) — see the "busy hours" issue this
    # was added for. The catch-ups are safe to add for exactly one reason:
    # main() (see main.py) checks count_posts_on_date() first thing and
    # returns immediately once posted_today >= POSTS_PER_DAY — so if the
    # primary already succeeded, its catch-up run is a fast no-op (a few
    # seconds: checkout + harvest_pending_polls + the DB-rebuild check,
    # nothing else). If the primary was delayed or dropped, the catch-up
    # is what actually posts — main.py picks the day's Nth-post-so-far by
    # COUNT, not by which literal cron fired, so it doesn't matter which of
    # the two runs wins; whichever runs first becomes that slot.
    #
    # Times are UTC; Asia/Tehran is UTC+3:30 with no DST. Minutes are
    # deliberately off :00/:30 (the two most-contended marks) — see
    # NOT_IN_THIS_ZIP.md / chat history for the specific GitHub-docs-cited
    # reasoning if this ever needs re-deriving.
    - cron: "8 5 * * *"    # slot 1 primary  (~08:38 Tehran) — day's scheduled format
    - cron: "53 5 * * *"   # slot 1 catch-up (~09:23 Tehran, ~45 min later)
    - cron: "24 11 * * *"  # slot 2 primary  (~14:54 Tehran) — reader/review/news slot
    - cron: "9 12 * * *"   # slot 2 catch-up (~15:39 Tehran)
    - cron: "42 17 * * *"  # slot 3 primary  (~21:12 Tehran) — reader/review/news slot
    - cron: "27 18 * * *"  # slot 3 catch-up (~21:57 Tehran)
  workflow_dispatch: {}  # manual "Run workflow" button, for testing/recovery

permissions:
  contents: write

concurrency:
  # Prevents two runs from racing to commit data/ if a manual dispatch
  # overlaps a scheduled run — main.py's own count_posts_on_date guard
  # handles same-day duplicates, but this avoids a messier git race on top
  # of that.
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Was fetch-depth: 0 (full history) — that was the real
          # compounding cost in the old posts.db problem: every run
          # re-downloaded the ENTIRE accumulated history of a binary file
          # that only ever grew. Now that posts.db isn't committed at all
          # (see database.py / AUDIT_FIXES.md #9), a full clone no longer
          # has that specific problem, but it would still slowly grow
          # forever as a general matter of history size. depth: 1 is
          # enough for this job's actual git usage (one local commit,
          # `git pull --rebase origin main`, push) — verified locally by
          # simulating a depth-1 clone against a remote that had moved
          # forward from a concurrent push (weekly_strategy.yml /
          # monthly_cross_promo.yml can each push independently while this
          # is running, since they're in different concurrency groups):
          # rebase and push both succeeded cleanly. Worth watching the
          # first couple of live runs after this change, since that's a
          # simulation, not GitHub's actual infrastructure.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python main.py

      - name: Commit updated data
        if: always()  # commit whatever state changed even if main.py exited non-zero partway through
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily post: update memory and database"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts."
          # A post can go out to Telegram successfully above even though the
          # data/ commit that records it never lands — that leaves
          # memory.json/posts.db/analytics.json/campaign_state.json stale on
          # origin/main, and every downstream feature that reads them
          # (dedup, review scheduling, weekly strategy) is stale until
          # someone notices. This is the only thing that catches that
          # specific failure mode.
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -d text="🔴 پست امروز احتمالاً منتشر شد، ولی ثبت تغییرات data/ توی گیت بعد از ۵ بار تلاش شکست خورد. یعنی memory.json/posts.db/analytics.json فعلاً روی origin/main قدیمی مونده — لازمه دستی چک و درست بشه، وگرنه ممکنه یه موضوع/جوک دوباره تکرار بشه." \
              > /dev/null || echo "::warning::Admin alert send also failed."
          else
            echo "::warning::TELEGRAM_ADMIN_CHAT_ID or TELEGRAM_BOT_TOKEN not set — no admin alert sent for the push failure."
          fi
          exit 1
