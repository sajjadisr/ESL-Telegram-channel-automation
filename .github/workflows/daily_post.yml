# RECONSTRUCTED FILE — see NOT_IN_THIS_ZIP.md at the project root.
#
# This zip export didn't include .github/workflows at all, but
# story-removal-and-fixes.diff proves a real daily_post.yml already exists
# in your actual repo (that diff shows hunks being applied *to* it). This
# file is rebuilt from those hunks + config.py's own comments (POSTS_PER_DAY,
# the secrets every module reads) — it is NOT a copy of your live file.
# Diff it against the real one on GitHub before replacing anything; if they
# disagree, yours is the source of truth, not this.
#
# Without a workflow file like this, nothing in main.py runs on its own —
# every "autonomous"/"self-sustaining" mechanism in this codebase (topic
# auto-refill, spaced-repetition review, reader/news rotation, poll
# harvesting) only fires when something actually invokes `python main.py`.
# This is that invocation.

name: Daily Post

on:
  schedule:
    # POSTS_PER_DAY = 3 in config.py — one cron trigger per daily slot.
    # Keep the count here in sync with that constant (main.py's own
    # comment on POSTS_PER_DAY says the same thing). Times are UTC;
    # Asia/Tehran is UTC+3:30 with no DST, so these land at roughly
    # 09:00 / 15:00 / 21:00 Tehran time.
    - cron: "30 5 * * *"   # slot 1 (~09:00 Tehran) — day's scheduled format
    - cron: "30 11 * * *"  # slot 2 (~15:00 Tehran) — reader/review/news slot
    - cron: "30 17 * * *"  # slot 3 (~21:00 Tehran) — reader/review/news slot
  workflow_dispatch: {}  # manual "Run workflow" button, for testing/recovery

permissions:
  contents: write

concurrency:
  # Prevents two runs from racing to commit data/ if a manual dispatch
  # overlaps a scheduled run — main.py's own count_posts_on_date guard
  # handles same-day duplicates, but this avoids a messier git race on top
  # of that.
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, needed for the rebase-and-push loop below

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python main.py

      - name: Commit updated data
        if: always()  # commit whatever state changed even if main.py exited non-zero partway through
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily post: update memory and database"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts."
          # A post can go out to Telegram successfully above even though the
          # data/ commit that records it never lands — that leaves
          # memory.json/posts.db/analytics.json/campaign_state.json stale on
          # origin/main, and every downstream feature that reads them
          # (dedup, review scheduling, weekly strategy) is stale until
          # someone notices. This is the only thing that catches that
          # specific failure mode.
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -d text="🔴 پست امروز احتمالاً منتشر شد، ولی ثبت تغییرات data/ توی گیت بعد از ۵ بار تلاش شکست خورد. یعنی memory.json/posts.db/analytics.json فعلاً روی origin/main قدیمی مونده — لازمه دستی چک و درست بشه، وگرنه ممکنه یه موضوع/جوک دوباره تکرار بشه." \
              > /dev/null || echo "::warning::Admin alert send also failed."
          else
            echo "::warning::TELEGRAM_ADMIN_CHAT_ID or TELEGRAM_BOT_TOKEN not set — no admin alert sent for the push failure."
          fi
          exit 1
