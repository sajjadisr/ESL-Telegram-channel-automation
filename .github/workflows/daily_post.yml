name: Daily Post

on:
  schedule:
    # 3 runs/day to match config.POSTS_PER_DAY — keep these two in sync if
    # you change that value. Times are UTC; roughly 09:00 / 15:00 / 21:00
    # Iran time (UTC+3:30).
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional — a second Gemini key, ideally from a different Google
          # account, only ever used if GEMINI_API_KEY fails with an auth
          # error (see ai.GeminiAuthError). Leave unset to run with just the
          # one key, same as before.
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          # Optional — leave the secret unset and this is just an empty string,
          # which the code treats the same as "not configured".
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Also optional — set these to turn on Eitaa/Bale cross-posting.
          # Leave a secret unset and that platform is silently skipped.
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily post: update memory, story and database"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed (origin/main moved) — retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts."
          exit 1