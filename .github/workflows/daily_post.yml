name: Daily Post

on:
  schedule:
    # 3 runs/day to match config.POSTS_PER_DAY — keep these two in sync if
    # you change that value. Times are UTC; roughly 09:00 / 15:00 / 21:00
    # Iran time (UTC+3:30).
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional — a second Gemini key, ideally from a different Google
          # account, only ever used if GEMINI_API_KEY fails with an auth
          # error (see ai.GeminiAuthError). Leave unset to run with just the
          # one key, same as before.
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          # Optional — free (no credit card) fallback text model, tried only
          # if every Gemini key above fails for a given call. Get a key at
          # console.groq.com. Leave unset to run with Gemini only.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional — free (no credit card) fallback image model, tried only
          # if both Gemini image tiers fail. dash.cloudflare.com -> Workers AI.
          # Leave either unset to skip this fallback (existing manual admin
          # hand-off still applies).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional — leave the secret unset and this is just an empty string,
          # which the code treats the same as "not configured".
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Also optional — set these to turn on Eitaa/Bale cross-posting.
          # Leave a secret unset and that platform is silently skipped.
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}

      - name: Commit updated data
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily post: update memory and database"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed (origin/main moved) — retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts."
          # A post can go out to Telegram successfully in the run above even
          # though the data/ commit that records it never lands (exactly
          # what happened on 2026-07-26: the 22:48 post published, but
          # nothing after it got committed) — the previous run's memory.json/
          # posts.db/analytics.json/campaign_state.json are now silently
          # stale on origin/main, and every downstream feature that reads
          # them (dedup, review scheduling, weekly strategy) is stale until
          # someone notices and fixes it by hand. This alert is the only
          # thing that currently exists for that failure mode — the
          # Gemini/content-failure alerts elsewhere don't cover it.
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -d text="🔴 پست امروز احتمالاً منتشر شد، ولی ثبت تغییرات data/ توی گیت بعد از ۵ بار تلاش شکست خورد. یعنی memory.json/posts.db/analytics.json فعلاً روی origin/main قدیمی مونده — لازمه دستی چک و درست بشه، وگرنه ممکنه یه موضوع/جوک دوباره تکرار بشه." \
              > /dev/null || echo "::warning::Admin alert send also failed."
          else
            echo "::warning::TELEGRAM_ADMIN_CHAT_ID or TELEGRAM_BOT_TOKEN not set — no admin alert sent for the push failure."
          fi
          exit 1