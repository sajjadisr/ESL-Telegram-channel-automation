# If you already have a version of this, keep yours.

name: Monthly Cross-Promo

on:
  schedule:
    # 1st of each month, ~11:38 Tehran time. Minute deliberately off :00
    # (the busiest mark in the hour on GitHub's scheduler — see
    # daily_post.yml's comment for the full reasoning). No catch-up trigger
    # here on purpose, and this one matters more than weekly_strategy's:
    # scripts/send_cross_promo.py has NO dedup guard at all — it just sends
    # the message unconditionally every time it's invoked (see its main()).
    # A catch-up trigger would risk actually double-posting the cross-promo
    # message to the real channel, which is worse than the occasional
    # multi-hour delay this is meant to fix. Once-a-month cadence makes
    # that delay low-stakes anyway.
    - cron: "23 8 1 * *"
  workflow_dispatch: {}

jobs:
  cross_promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send cross-promo message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python scripts/send_cross_promo.py
