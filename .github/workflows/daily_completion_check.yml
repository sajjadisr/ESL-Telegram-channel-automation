# Dead-man's-switch for daily_post.yml — see scripts/check_daily_completion.py
# for the full reasoning. Read-only: no commit step, nothing here ever
# writes to the repo or posts to the channel, it only ever DMs the admin.

name: Daily Completion Check

on:
  schedule:
    # Bug fix (#93): was "5 20 * * *" (20:05 UTC / 23:35 Tehran) — only 25
    # minutes before Tehran midnight (20:30 UTC), the moment clock.py rolls
    # "today" over to the next day. GitHub Actions' own documented
    # scheduled-run delays routinely eat more than that: confirmed directly
    # in production, the 20:05 UTC trigger actually started at 20:29-20:30
    # UTC on back-to-back days — one run landing at 20:29:29 (still just
    # inside the old day, a real, meaningful "0 posts today" alert) and the
    # very next day's run landing at 20:30:05 (just PAST midnight Tehran),
    # which made it silently evaluate the brand-new day that had only been
    # alive for 5 seconds — a guaranteed, meaningless "0/3" alert about a
    # day that never had a chance to post anything, not a real problem with
    # the day before. Moved to 19:30 UTC (23:00 Tehran): a full 60-minute
    # margin against that same class of delay, while still running safely
    # after slot 3's catch-up (~21:57 Tehran / 18:27 UTC in daily_post.yml)
    # has had its chance.
    - cron: "30 19 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check today's post count
        env:
          # config.py requires all three of these (no default) even though
          # this script only ever calls send_admin_message — same secrets
          # daily_post.yml already has configured.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python scripts/check_daily_completion.py
